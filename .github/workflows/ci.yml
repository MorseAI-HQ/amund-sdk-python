# Standalone template; install under .github/workflows/ only after review.
name: SDK — independent validation
on:
  pull_request:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned SHA-256)
        # Verified against a checksum pinned here, not one fetched alongside the binary.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # pragma: allowlist secret (published checksum, not a secret)
        run: |
          curl -sSL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan complete repository history
        run: gitleaks git . --config .gitleaks.toml --redact --log-opts="--all"
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: apps/sdk/python
        run: uv sync --frozen --all-extras --dev
      - name: Test without live-backend integration cases
        working-directory: apps/sdk/python
        run: uv run --frozen pytest -m "not integration"
      - name: Lint
        working-directory: apps/sdk/python
        run: uv run --frozen ruff check .
      - name: Build distributions (amund + morse-ai compat shim)
        working-directory: apps/sdk/python
        run: |
          uv build --out-dir dist/amund
          uv build compat/morse-ai --out-dir dist/morse-ai
      - name: Validate package metadata
        working-directory: apps/sdk/python
        run: uv tool run twine check dist/amund/* dist/morse-ai/*
      - name: Smoke-test both wheels in a clean venv
        working-directory: apps/sdk/python
        run: |
          uv venv /tmp/wheel-smoke
          uv pip install -p /tmp/wheel-smoke/bin/python dist/amund/*.whl dist/morse-ai/*.whl
          /tmp/wheel-smoke/bin/python - <<'PY'
          import warnings
          warnings.simplefilter("ignore", DeprecationWarning)
          import amund, morse_ai, morse_ai.tracing, amund.tracing
          assert morse_ai is amund and morse_ai.tracing is amund.tracing
          PY
          uv pip uninstall -p /tmp/wheel-smoke/bin/python morse-ai
          /tmp/wheel-smoke/bin/python -c "import amund; print('amund', amund.__version__)"
