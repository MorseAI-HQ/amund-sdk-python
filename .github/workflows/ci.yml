# Standalone template; install under .github/workflows/ only after review.
name: SDK — independent validation
on:
  pull_request:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned scanner
        run: |
          case "$(uname -m)" in
            aarch64|arm64) GL_ARCH=arm64 ;;
            x86_64) GL_ARCH=x64 ;;
            *) exit 1 ;;
          esac
          curl --fail -sSL --retry 5 --retry-all-errors --connect-timeout 15 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          mkdir -p /tmp/morse-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/morse-gitleaks gitleaks
      - name: Scan complete repository history
        run: /tmp/morse-gitleaks/gitleaks git . --config .gitleaks.toml --redact --log-opts="--all"
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: apps/sdk/python
        run: uv sync --frozen --all-extras --dev
      - name: Test without live-backend integration cases
        working-directory: apps/sdk/python
        run: uv run --frozen pytest -m "not integration"
      - name: Lint
        working-directory: apps/sdk/python
        run: uv run --frozen ruff check .
      - name: Build distributions
        working-directory: apps/sdk/python
        run: uv build
      - name: Validate package metadata
        working-directory: apps/sdk/python
        run: uv tool run twine check dist/*
