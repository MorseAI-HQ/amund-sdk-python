# Compatibility distribution: `pip install morse-ai` keeps working after the
# Morse -> Amund rename (founder decision 2026-11-25). The wheel holds only the
# `morse_ai` alias package; all code lives in the `amund` distribution, pinned
# to the exact same version. Bump `version` and the `amund==` pins together
# with ../../pyproject.toml; tests/test_compat_morse_ai.py enforces that.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morse-ai"
version = "0.9.0"
description = "Deprecated: renamed to 'amund'. Installs amund and keeps `import morse_ai` working."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Amund", email = "hello@amundai.com" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["amund==0.9.0"]

# Same extras as amund, so `pip install "morse-ai[anthropic]"` keeps working.
[project.optional-dependencies]
anthropic = ["amund[anthropic]==0.9.0"]
openai = ["amund[openai]==0.9.0"]
openai_agents = ["amund[openai_agents]==0.9.0"]
langchain = ["amund[langchain]==0.9.0"]
langgraph = ["amund[langgraph]==0.9.0"]
claude_agent_sdk = ["amund[claude_agent_sdk]==0.9.0"]
strands = ["amund[strands]==0.9.0"]
google_genai = ["amund[google_genai]==0.9.0"]
all = ["amund[all]==0.9.0"]

[project.urls]
Homepage = "https://amundai.com"
Documentation = "https://docs.amundai.com"
Repository = "https://github.com/MorseAI-HQ/amund-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/morse_ai"]
